<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stack Overflown - A Dev-Themed Puzzle Game</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app">
    <section class="game-card" aria-live="polite">
      <p class="eyebrow">Number Guessing Game</p>
      <h1>Guess the Number</h1>
      <p class="subtitle">I’m thinking of a number between 1 and 100.</p>

      <div class="controls-row">
        <div class="difficulty-picker">
          <label for="difficultySelect">Difficulty</label>
          <select id="difficultySelect" aria-label="Select difficulty">
            <option value="easy">Easy (1-50)</option>
            <option value="medium" selected>Medium (1-100)</option>
            <option value="hard">Hard (1-500)</option>
          </select>
        </div>

        <label class="sr-only" for="guessInput">Your guess</label>
        <input id="guessInput" type="number" min="1" max="100" placeholder="Enter a number" autocomplete="off" />
        <button id="guessButton" type="button">Guess</button>
      </div>

      <div class="status-bar">
        <span>Attempts: <strong id="attempts">0</strong></span>
        <span>Score: <strong id="score">100</strong></span>
        <button id="restartButton" class="secondary" type="button">Restart</button>
      </div>

      <div id="message" class="message">Make your first guess!</div>

      <div class="history">
        <h2>Previous guesses</h2>
        <ul id="guessList" class="guess-list">
          <li>No guesses yet</li>
        </ul>
      </div>

      <div class="leaderboard">
        <h2>Top 5 Scores</h2>
        <ol id="leaderboardList" class="leaderboard-list">
          <li>No scores yet</li>
        </ol>
      </div>
    </section>
  </main>

  <script src="index.js"></script>
</body>

</html>
